<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/pretendard.css">
<title>FastVOCAB 설정</title>
<style>button,input{font:inherit}body{font:14px Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;max-width:480px;margin:24px}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px}</style>
<h2>FastVOCAB 설정</h2>
<p>처음이라면 <a href="https://github.com/gawonm/FastVOCAB#설정" target="_blank">설정 가이드</a>를 먼저 보세요.
Notion 토큰과 DB ID만 있으면 시작할 수 있고, 나머지 키는 선택입니다.</p>
<label>Notion Integration 토큰</label>
<input id="token" type="password" autocomplete="off">
<label>단어장 DB ID</label>
<input id="dbId">
<label>Merriam-Webster Learner's 키 (선택)</label>
<input id="mwKey" type="password" autocomplete="off">
<label>표준국어대사전 키 (한-한 사전용)</label>
<input id="stdictKey" type="password" autocomplete="off">
<label>온용어 키 (공학·AI 한글 용어용)</label>
<input id="ktermKey" type="password" autocomplete="off">
<p><button id="save">저장</button> <span id="msg"></span></p>
<script src="options.js"></script>
